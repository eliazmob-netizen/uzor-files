proxy-groups:
- name: 🚀 Выбор
  type: select
  proxies:
  - 🌐 Все серверы
  - 🌍 Без РФ
  - 🌍 Страны
  - 🛡 Реклама
  - 🔞 18+
  - 🎯 Direct
- name: 🌐 Все серверы
  type: url-test
  proxies:
  - 🇳🇱 Нидерланды | wiki_2 | 1.15 Mbps 📺360p
  url: https://www.gstatic.com/generate_204
  interval: 20
  tolerance: 10
  lazy: true
- name: 🌍 Без РФ
  type: url-test
  proxies:
  - 🇳🇱 Нидерланды | wiki_2 | 1.15 Mbps 📺360p
  url: https://www.gstatic.com/generate_204
  interval: 20
  tolerance: 10
  lazy: true
- name: 🗺 🇳🇱 Нидерланды
  type: url-test
  proxies:
  - 🇳🇱 Нидерланды | wiki_2 | 1.15 Mbps 📺360p
  url: https://www.gstatic.com/generate_204
  interval: 20
  tolerance: 10
  lazy: true
- name: 🌍 Страны
  type: select
  proxies:
  - 🗺 🇳🇱 Нидерланды
- name: 🎯 Direct
  type: select
  proxies:
  - DIRECT
- name: 🛡 Реклама
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🔞 18+
  type: select
  proxies:
  - REJECT
  - DIRECT
