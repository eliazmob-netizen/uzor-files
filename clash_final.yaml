  type: vless
  server: 185.103.100.211
  port: 443
  uuid: 5ad13ef8-ced8-43b5-9d8c-f046a3ce9ddc
  tls: true
  network: tcp
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  servername: msk2e.g-magnum.icu
  reality-opts:
    public-key: sRmbdpwZ5gtUVEu1BMXE71DRHDWhBLCoLh6QiFazm2U
    short-id: '00000000001b2a3f'
proxy-providers:
  top_source:
    type: http
    url: https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/vless.txt
    interval: 3600
    path: ./providers/top_source.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
